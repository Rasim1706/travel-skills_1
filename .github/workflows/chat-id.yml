name: find-telegram-chat-id
on:
  push:
    paths: ['.github/workflows/chat-id.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  find:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Read bot updates
        run: |
          curl -s "https://api.telegram.org/bot8798687340:AAEfZSnZs-vqd28NL66BxUqnev9mQ70qYMQ/getUpdates?allowed_updates=%5B%22message%22,%22my_chat_member%22%5D" \
            | jq '[.result[] | (.message.chat // .my_chat_member.chat // .channel_post.chat) | select(.!=null) | {id, type, title}] | unique' > chat-ids.json
          cat chat-ids.json
      - name: Save result
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add chat-ids.json
          git commit -m "chat ids" || echo "nothing"
          git push
