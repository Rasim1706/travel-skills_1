name: telegram-test-lead
on:
  push:
    paths: ['.github/workflows/chat-id.yml']
permissions:
  contents: write
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          curl -s "https://api.telegram.org/bot8798687340:AAEfZSnZs-vqd28NL66BxUqnev9mQ70qYMQ/sendMessage" \
            --data-urlencode "chat_id=-5324192026" \
            --data-urlencode "text=Тест: квиз подключён. Сюда будут приходить заявки с сайта rasim1706.github.io/travel-skills_1" \
            | jq '{ok, description}' > tg-debug.json
          cat tg-debug.json
          rm -f chat-ids.json
          git config user.name "github-actions"; git config user.email "github-actions@users.noreply.github.com"
          git add -A; git commit -m "test lead result"; git push
