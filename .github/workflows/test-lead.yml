name: test-lead
on:
  push:
    paths: ['.github/workflows/test-lead.yml']
permissions:
  contents: write
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          P='{"text":"ТЕСТОВАЯ заявка (проверка кнопок)\n\nИмя: Тест\nТелефон: +998900000000\nКурс: Турагент с нуля","name":"Тест","phone":"+998900000000","tg":"","course":"Турагент с нуля","heat":"горячий","answers":"тест"}'
          curl -sS -L -o /dev/null -w "%{http_code}" --data-urlencode "payload=$P" "https://script.google.com/macros/s/AKfycbx8EDg_ocL8cjhWmlHXppjtus1CQN6BGbqOzPCztQ-E8UyH2dzV1mD0KoJzPVjkCNgK/exec" > result.txt || true
          echo >> result.txt
          curl -s "https://api.telegram.org/bot8798687340:AAEfZSnZs-vqd28NL66BxUqnev9mQ70qYMQ/getWebhookInfo" | jq -c '{url_set: (.result.url|length>0), pending: .result.pending_update_count, last_error: .result.last_error_message}' >> result.txt
          cat result.txt
          git config user.name "github-actions"; git config user.email "github-actions@users.noreply.github.com"
          git rm -q -r .github; git add result.txt; git commit -m "test lead result"; git push
