name: test-lead-sheet
on:
  push:
    paths: ['.github/workflows/test-lead.yml']
permissions:
  contents: write
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          P='{"name":"ТЕСТ (можно удалить)","phone":"+998900000000","tg":"","course":"Турагент с нуля","heat":"горячий","answers":"тестовая строка"}'
          curl -sS -L -o /dev/null -w "%{http_code}" --data-urlencode "payload=$P" "https://script.google.com/macros/s/AKfycbwekBAEhXPl6YwPW3UKTm6BxVD3o2T3aAwWOmx_oujmbvhBbBs0UT7ALCCjVvfQ66AFuw/exec" > result.txt || true
          cat result.txt
          git config user.name "github-actions"; git config user.email "github-actions@users.noreply.github.com"
          git rm -q -r .github; git add result.txt; git commit -m "test result"; git push
